<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" data-state="normal">
  <!--
    twitch-adblock gecko, original artwork. Source for icons/icon48*.png and icons/icon128*.png
    (the 16px icons come from gecko-16.svg). Rebuild with: node scripts/build-icons.mjs
    data-state on the root picks the variant: "normal", "working" (glowing eyes) or "off" (greyed out).
  -->
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2cc0bd"/>
      <stop offset="1" stop-color="#0b8a8d"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3a96f2"/>
      <stop offset="1" stop-color="#1663d1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0.4" stop-color="#ffe066"/>
      <stop offset="0.6" stop-color="#ffc23a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grey" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.25 0.55 0.1 0 0.06  0.25 0.55 0.1 0 0.06  0.25 0.55 0.1 0 0.06  0 0 0 1 0"/>
    </filter>
  </defs>
  <style>
    .ink { stroke: #11221d; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .skin { fill: #7fd327; }
    .belly { fill: #b4ec6a; }
    .glow, .lid { display: none; }
    .eye-white { fill: #ffffff; }
    svg[data-state="working"] .glow { display: inline; }
    svg[data-state="working"] .eye-white { fill: #ffc93c; }
    svg[data-state="off"] .lid { display: inline; }
    svg[data-state="off"] #art { filter: url(#grey); }
  </style>
  <g id="art">
    <circle cx="64" cy="64" r="61" fill="url(#bg)" stroke="#0a6266" stroke-width="3"/>

    <!-- tail: sweeps behind the shield, drawn first so everything sits on top -->
    <path class="ink skin" d="M48 92 C 47 108, 58 119, 74 119 C 87 119, 95 112, 99 104 C 100.5 100.5, 96.5 98, 94.5 101 C 90 107.5, 84 111, 76 111 C 66 111, 60.5 103, 62 92 Z"/>

    <!-- back leg -->
    <path class="ink skin" d="M44 84 C 36 86, 32 92, 34 100 L 27 101 C 23 101, 23 107, 27 107 L 40 107 C 43 107, 43 103, 41 101 C 40 96, 42 93, 48 92 Z"/>

    <!-- head and body -->
    <path class="ink skin" d="M23 41 C 22 33, 34 22, 48 19 C 62 16, 72 24, 72 38 C 72 47, 68 52, 67 60 C 66 70, 68 80, 64 90 C 61 97, 53 99, 47 96 C 40 92, 38 84, 41 74 C 43 66, 50 61, 50 56 C 50 53, 46 52, 40 51 C 32 50, 24 48, 23 41 Z"/>
    <path class="belly" d="M46 92 C 41 88, 41 80, 44 73 C 47 67, 52 64, 54 60 C 56 70, 55 84, 52 92 C 50 94, 48 94, 46 92 Z" opacity="0.8"/>
    <!-- mouth and nostril -->
    <path d="M26 44 C 32 46, 38 46, 44 45" fill="none" stroke="#11221d" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="28" cy="36" r="1.6" fill="#11221d"/>

    <!-- eye: white normally, glowing amber when blocking is working, half shut when off -->
    <circle class="glow" cx="54" cy="33" r="22" fill="url(#glow)"/>
    <circle class="ink eye-white" cx="54" cy="33" r="9" stroke-width="3"/>
    <ellipse cx="55" cy="33" rx="2.4" ry="6" fill="#11221d"/>
    <circle cx="51.5" cy="29.5" r="1.6" fill="#ffffff"/>
    <path class="lid ink skin" stroke-width="3" d="M44.5 33 A 9.5 9.5 0 0 1 63.5 33 Z"/>


    <!-- shield with the "no" sign -->
    <path class="ink" fill="url(#shield)" d="M86 46 C 94 52, 102 54, 110 54 C 111 72, 108 92, 86 106 C 64 92, 61 72, 62 54 C 70 54, 78 52, 86 46 Z"/>
    <path d="M86 52 C 92 56, 98 58, 104 58 C 104 64, 103 70, 101 75 C 95 66, 82 58, 68 58 C 74 58, 80 56, 86 52 Z" fill="#ffffff" opacity="0.18"/>
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <circle cx="88" cy="76" r="11"/>
      <path d="M80.2 68.2 L 95.8 83.8"/>
    </g>

    <!-- arm gripping the shield rim -->
    <path d="M51 64 C 52 74, 57 78, 66 77" fill="none" stroke="#11221d" stroke-width="12" stroke-linecap="round"/>
    <path d="M51 64 C 52 74, 57 78, 66 77" fill="none" stroke="#7fd327" stroke-width="5" stroke-linecap="round"/>
    <g class="ink skin" stroke-width="2.4">
      <circle cx="69" cy="72.5" r="3"/>
      <circle cx="71.5" cy="77.5" r="3"/>
      <circle cx="69" cy="82.5" r="3"/>
    </g>
    <path d="M51 64 C 52 74, 57 78, 66 77" fill="none" stroke="#7fd327" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
